name: pago-f21-local
services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: pago
      POSTGRES_USER: pago
      POSTGRES_PASSWORD: ${PAGO_DB_PASSWORD:?Set a local-only PAGO_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pago_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pago -d pago"]
      interval: 3s
      timeout: 3s
      retries: 20
  pago:
    build: .
    ports:
      - "127.0.0.1:18085:8080"
    environment:
      PAGO_DB_URL: jdbc:postgresql://postgres:5432/pago
      PAGO_DB_USER: pago
      PAGO_DB_PASSWORD: ${PAGO_DB_PASSWORD:?Set a local-only PAGO_DB_PASSWORD in .env}
      PAGO_FIXTURES_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pago_data:
