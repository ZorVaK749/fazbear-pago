map $uri $ev3_service {
    default "";
    ~^/api/pagos(/|$) pago;
    ~^/api/recomendaciones(/|$) analytics;
    ~^/api/analytics(/|$) analytics;
    ~^/api/fidelizacion(/|$) fidelizacion;
    ~^/api/productos(/|$) productos;
    ~^/api/carrito(/|$) carrito;
    ~^/api/orden(/|$) orden;
    ~^/api/pedidos(/|$) pedidos;
}
server {
    listen 8080;
    server_name localhost;
    access_log off;
    client_max_body_size 128k;
    resolver 127.0.0.11 valid=2s ipv6=off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 20s;
    location = /health { default_type application/json; return 200 '{"status":"UP","mode":"EV3_LOCAL_ONLY"}'; }
    location /internal/ { return 404; }
    location /api/ {
        if ($ev3_service = "") { return 404; }
        proxy_set_header X-Service-Key "";
        proxy_pass http://$ev3_service:8080;
    }
    location / { return 404; }
}
