name: pedidos360-ev3-kafka-ui-proxy

services:
  proxy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    network_mode: host
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.25
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    environment:
      KAFKA_UI_PUBLIC_IPV4: ${KAFKA_UI_PUBLIC_IPV4:?Export the EC2 public IPv4}
      KAFKA_UI_PRIVATE_IPV4: ${KAFKA_UI_PRIVATE_IPV4:?Export the EC2 private IPv4}
      KAFKA_UI_CLIENT_IPV4: ${KAFKA_UI_CLIENT_IPV4:?Export the demo client public IPv4}
    volumes:
      - ./Caddyfile.kafka-ui:/etc/caddy/Caddyfile:ro
      - type: bind
        source: ./kafka-ui.credentials
        target: /etc/caddy/kafka-ui.credentials
        read_only: true
        bind:
          create_host_path: false
      - certificates:/data

volumes:
  certificates:
