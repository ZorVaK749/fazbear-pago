name: Reusable versioned GHCR build (no AWS deployment)
on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      frontend:
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  image:
    if: github.ref == 'refs/heads/ev3/integracion-integral'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_DB: ev3test
          POSTGRES_USER: ev3test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ev3test"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/ev3test
      TEST_DATABASE_USER: ev3test
      TEST_DATABASE_PASSWORD: synthetic-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: ${{ !inputs.frontend }}
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend (Docker/Testcontainers available)
        if: ${{ !inputs.frontend }}
        run: mvn -B -ntp clean verify
      - uses: actions/setup-node@v4
        if: inputs.frontend
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Verify Angular
        if: inputs.frontend
        run: |
          npm ci
          npm test -- --watch=false
          npm run build
      - name: Unique version (never latest or a shared mutable branch tag)
        id: version
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: Dockerfile.aws
          platforms: linux/amd64
          push: ${{ inputs.publish }}
          tags: ${{ steps.version.outputs.image }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=ev3-aws
          cache-to: type=gha,mode=max,scope=ev3-aws
      - name: Record image and digest (not a deployment)
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          PUBLISHED: ${{ inputs.publish }}
        run: |
          printf 'Image: `%s`\n\nDigest: `%s`\n\nPublished: `%s`\n' "$IMAGE" "$DIGEST" "$PUBLISHED" >> "$GITHUB_STEP_SUMMARY"
