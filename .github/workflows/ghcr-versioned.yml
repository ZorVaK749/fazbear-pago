name: Prepare or publish versioned AWS image (manual)
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to GHCR (never deploys to AWS)
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  image:
    uses: ./.github/workflows/ghcr-build.yml
    with:
      publish: ${{ inputs.publish }}
