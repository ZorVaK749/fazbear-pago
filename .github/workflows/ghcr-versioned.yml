name: Prepare or publish versioned AWS image
on:
  push:
    branches:
      - ev3/integracion-integral
      - ev3/webpay-integracion
    paths-ignore:
      - 'docs/**'
      - 'deploy/ev3-local/**'
      - '.github/workflows/ev3-integration.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to GHCR (never deploys to AWS)
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  image:
    uses: ./.github/workflows/ghcr-build.yml
    with:
      publish: ${{ github.event_name == 'push' || inputs.publish == true }}
